<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Tienda · Amaré Studio</title>
  <meta name="description" content="Álbumes de fotos físicos y plantillas editables en Canva. Filtrá por tipo, ocasión y precio.">
  <meta name="theme-color" content="#F5EFE6">
  <link rel="icon" href="assets/favicon.svg?v=20260929" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css?v=20260929">
</head>
<body data-page="tienda">
  <div data-component="header"></div>

  <main id="contenido">
    <section class="shop-hero container">
      <p class="eyebrow eyebrow-slash reveal">Tienda</p>
      <h1 class="reveal" data-shop-title>Todos los álbumes</h1>
      <p class="reveal">Álbumes que producimos y enviamos a todo el país, y plantillas para editar en Canva a tu ritmo.</p>
    </section>

    <div class="container shop-layout">
      <aside>
        <form class="filters" data-filters id="filtros" aria-label="Filtros">
          <fieldset class="filter-group">
            <legend>Tipo</legend>
            <div class="segmented">
              <label><input type="radio" name="tipo" value="todos" checked><span>Todos</span></label>
              <label><input type="radio" name="tipo" value="fisico"><span>Físico</span></label>
              <label><input type="radio" name="tipo" value="digital"><span>Canva</span></label>
            </div>
          </fieldset>
          <fieldset class="filter-group">
            <legend>Ocasión</legend>
            <div class="chips" data-occasions></div>
          </fieldset>
          <fieldset class="filter-group">
            <legend>Precio máximo</legend>
            <input class="range" type="range" name="max" aria-label="Precio máximo">
            <div class="range-out"><span>Hasta</span><strong data-price-out></strong></div>
          </fieldset>
          <fieldset class="filter-group">
            <legend>Ordenar</legend>
            <label class="sr-only" for="orden">Ordenar por</label>
            <select class="select" id="orden" name="orden" style="width:100%">
              <option value="destacados">Destacados</option>
              <option value="precio-asc">Menor precio</option>
              <option value="precio-desc">Mayor precio</option>
              <option value="nombre">Nombre A–Z</option>
            </select>
          </fieldset>
          <button type="button" class="btn-link" data-reset>Limpiar filtros</button>
        </form>
      </aside>
      <div>
        <div class="shop-toolbar">
          <span data-result-count aria-live="polite"></span>
          <button type="button" class="btn btn-outline btn-small filters-toggle" data-filters-toggle aria-expanded="false" aria-controls="filtros">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg> Filtrar
          </button>
        </div>
        <div class="product-grid" data-product-grid aria-live="polite">
          <noscript><p>Activá JavaScript para ver el catálogo.</p></noscript>
        </div>
      </div>
    </div>
  </main>

  <div data-component="footer"></div>

  <script defer src="js/config.js?v=20260929"></script>
  <script defer src="js/data/products.js?v=20260929"></script>
  <script defer src="js/services/catalog.js?v=20260929"></script>
  <script defer src="js/cart.js?v=20260929"></script>
  <script defer src="js/ui/components.js?v=20260929"></script>
  <script defer src="js/ui/cart-drawer.js?v=20260929"></script>
  <script defer src="js/ui/effects.js?v=20260929"></script>
  <script defer src="js/pages/shop.js?v=20260929"></script>
  <script defer src="js/main.js?v=20260929"></script>
</body>
</html>
