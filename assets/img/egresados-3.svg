<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1250" width="1000" height="1250" role="img"><title>Pliego panorámico del álbum Egresados</title><defs>
<filter id="egresadosdgrain" x="0" y="0" width="100%" height="100%">
  <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="7" result="n"/>
  <feColorMatrix type="matrix" values="0 0 0 0 .29  0 0 0 0 .2  0 0 0 0 .16  0 0 0 .07 0"/>
  <feComposite in2="SourceGraphic" operator="in"/>
</filter>
<filter id="egresadosdshadow" x="-20%" y="-20%" width="140%" height="150%">
  <feGaussianBlur in="SourceAlpha" stdDeviation="18"/>
  <feOffset dx="10" dy="22"/>
  <feComponentTransfer><feFuncA type="linear" slope=".22"/></feComponentTransfer>
  <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
<filter id="egresadosdsoft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="70"/></filter>
<linearGradient id="egresadosdspine" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#000" stop-opacity="0"/>
  <stop offset=".44" stop-color="#4A3228" stop-opacity=".05"/>
  <stop offset=".5" stop-color="#4A3228" stop-opacity=".22"/>
  <stop offset=".56" stop-color="#4A3228" stop-opacity=".05"/>
  <stop offset="1" stop-color="#000" stop-opacity="0"/>
</linearGradient>
</defs><rect width="1000" height="1250" fill="#F3F2F0"/><rect width="1000" height="1250" fill="#F3F2F0" filter="url(#egresadosgrain)"/><g opacity=".26" filter="url(#egresadossoft)" transform="rotate(-40 500.0 625.0)"><rect x="100" y="-500" width="110" height="2375" fill="#FFFDF8"/><rect x="300" y="-500" width="110" height="2375" fill="#FFFDF8"/><rect x="500" y="-500" width="110" height="2375" fill="#FFFDF8"/><rect x="700" y="-500" width="110" height="2375" fill="#FFFDF8"/></g><g transform="translate(500 640) rotate(6)" filter="url(#egresadosdshadow)"><rect x="-434" y="-282.0" width="868" height="564" rx="10" fill="#1E1E1E"/><rect x="-424.5" y="-267.0" width="849" height="540" rx="3" fill="#E6E4E0"/><rect x="-423.0" y="-268.0" width="846" height="540" rx="3" fill="#E6E4E0"/><rect x="-421.5" y="-269.0" width="843" height="540" rx="3" fill="#E6E4E0"/><rect x="-420" y="-270.0" width="420" height="540" rx="2" fill="#FFFCF6"/><rect x="0" y="-270.0" width="420" height="540" rx="2" fill="#FFFDF8"/><svg x="-382.2" y="-232.2" width="764.4" height="464.4" viewBox="0 0 160 120" preserveAspectRatio="xMidYMid slice"><g><defs><linearGradient id="egresadosdas" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#EFD2BE"/><stop offset="1" stop-color="#F7E9DA"/></linearGradient></defs><rect width="160" height="120" fill="url(#egresadosdas)"/><circle cx="80" cy="58" r="12" fill="#FCEBD4"/><path d="M0 64 L30 56 L60 62 L100 54 L160 64 V120 H0Z" fill="#B99885" opacity=".7"/><rect y="66" width="160" height="54" fill="#CDB59A"/><path d="M70 66 L90 66 L140 120 L20 120Z" fill="#6E5A4F"/><path d="M80 70 V76 M80 82 V92 M80 100 V116" stroke="#F4E7D6" stroke-width="1.6"/></g><rect width="160" height="120" fill="#fff" opacity=".04"/></svg><rect x="-210.0" y="-270.0" width="420" height="540" fill="url(#egresadosdspine)"/></g><g transform="translate(120 130) rotate(12)"><rect width="260" height="16" rx="3" fill="#D9B98C"/><rect width="260" height="5" fill="#E7CDA6"/><path d="M260 0 L296 8 L260 16Z" fill="#F1DEC4"/><path d="M286 5 L296 8 L286 11Z" fill="#1C1C1C"/><rect x="-24" width="24" height="16" rx="4" fill="#C9A565"/></g></svg>