<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000" role="img"><title>Retrato de una de las fundadoras</title><defs>
<filter id="hermana1grain" x="0" y="0" width="100%" height="100%">
  <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="7" result="n"/>
  <feColorMatrix type="matrix" values="0 0 0 0 .29  0 0 0 0 .2  0 0 0 0 .16  0 0 0 .07 0"/>
  <feComposite in2="SourceGraphic" operator="in"/>
</filter>
<filter id="hermana1shadow" x="-20%" y="-20%" width="140%" height="150%">
  <feGaussianBlur in="SourceAlpha" stdDeviation="18"/>
  <feOffset dx="10" dy="22"/>
  <feComponentTransfer><feFuncA type="linear" slope=".22"/></feComponentTransfer>
  <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
<filter id="hermana1soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="70"/></filter>
<linearGradient id="hermana1spine" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#000" stop-opacity="0"/>
  <stop offset=".44" stop-color="#4A3228" stop-opacity=".05"/>
  <stop offset=".5" stop-color="#4A3228" stop-opacity=".22"/>
  <stop offset=".56" stop-color="#4A3228" stop-opacity=".05"/>
  <stop offset="1" stop-color="#000" stop-opacity="0"/>
</linearGradient>
</defs><rect width="800" height="1000" fill="#EDEBE8"/><rect width="800" height="1000" fill="#EDEBE8" filter="url(#hermana1grain)"/><g opacity=".26" filter="url(#hermana1soft)" transform="rotate(-30 400.0 500.0)"><rect x="80" y="-400" width="88" height="1900" fill="#FFFDF8"/><rect x="240" y="-400" width="88" height="1900" fill="#FFFDF8"/><rect x="400" y="-400" width="88" height="1900" fill="#FFFDF8"/><rect x="560" y="-400" width="88" height="1900" fill="#FFFDF8"/></g><path d="M112.0 1000 Q128.0 660.0 400.0 640.0 Q672.0 660.0 688.0 1000Z" fill="#EBA6CB"/><path d="M240.0 720.0 Q208.0 300.0 400.0 240.0 Q592.0 300.0 560.0 720.0Z" fill="#5A3B2C"/><rect x="360.0" y="500.0" width="80.0" height="160.0" fill="#EBC6AA"/><ellipse cx="400.0" cy="430.0" rx="112.00000000000001" ry="170.0" fill="#EBC6AA"/><path d="M280.0 420.0 Q304.0 240.0 416.0 250.0 Q536.0 280.0 520.0 420.0 Q448.0 300.0 280.0 420.0Z" fill="#5A3B2C"/></svg>