<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800" role="img"><title>Publicación de Instagram de Amaré Studio</title><defs>
<filter id="ig2grain" x="0" y="0" width="100%" height="100%">
