<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1250" width="1000" height="1250" role="img"><title>Pliego panorámico del álbum Nuestra Historia</title><defs>
<filter id="nuestrahisdgrain" x="0" y="0" width="100%" height="100%">
  <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="7" result="n"/>
  <feColorMatrix type="matrix" values="0 0 0 0 .29  0 0 0 0 .2  0 0 0 0 .16  0 0 0 .07 0"/>
  <feComposite in2="SourceGraphic" operator="in"/>
</filter>
<filter id="nuestrahisdshadow" x="-20%" y="-20%" width="140%" height="150%">
  <feGaussianBlur in="SourceAlpha" stdDeviation="18"/>
  <feOffset dx="10" dy="22"/>
  <feComponentTransfer><feFuncA type="linear" slope=".22"/></feComponentTransfer>
  <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
<filter id="nuestrahisdsoft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="70"/></filter>
<linearGradient id="nuestrahisdspine" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#000" stop-opacity="0"/>
  <stop offset=".44" stop-color="#4A3228" stop-opacity=".05"/>
  <stop offset=".5" stop-color="#4A3228" stop-opacity=".22"/>
  <stop offset=".56" stop-color="#4A3228" stop-opacity=".05"/>
  <stop offset="1" stop-color="#000" stop-opacity="0"/>
</linearGradient>
</defs><rect width="1000" height="1250" fill="#EAE0D2"/><rect width="1000" height="1250" fill="#EAE0D2" filter="url(#nuestrahisgrain)"/><g opacity=".26" filter="url(#nuestrahissoft)" transform="rotate(-40 500.0 625.0)"><rect x="100" y="-500" width="110" height="2375" fill="#FFFDF8"/><rect x="300" y="-500" width="110" height="2375" fill="#FFFDF8"/><rect x="500" y="-500" width="110" height="2375" fill="#FFFDF8"/><rect x="700" y="-500" width="110" height="2375" fill="#FFFDF8"/></g><g transform="translate(500 640) rotate(6)" filter="url(#nuestrahisdshadow)"><rect x="-434" y="-282.0" width="868" height="564" rx="10" fill="#B98B84"/><rect x="-424.5" y="-267.0" width="849" height="540" rx="3" fill="#EFE7DA"/><rect x="-423.0" y="-268.0" width="846" height="540" rx="3" fill="#EFE7DA"/><rect x="-421.5" y="-269.0" width="843" height="540" rx="3" fill="#EFE7DA"/><rect x="-420" y="-270.0" width="420" height="540" rx="2" fill="#FFFCF6"/><rect x="0" y="-270.0" width="420" height="540" rx="2" fill="#FFFDF8"/><svg x="-382.2" y="-232.2" width="764.4" height="464.4" viewBox="0 0 160 120" preserveAspectRatio="xMidYMid slice"><g><defs><linearGradient id="nuestrahisdas" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F3C9A8"/><stop offset="1" stop-color="#F7E3CF"/></linearGradient></defs><rect width="160" height="120" fill="url(#nuestrahisdas)"/><circle cx="104" cy="62" r="16" fill="#FBEBD6" opacity=".95"/><path d="M0 78 Q40 58 80 72 T160 66 V120 H0Z" fill="#D9A28F"/><path d="M0 92 Q50 74 100 88 T160 84 V120 H0Z" fill="#B97D6C"/><path d="M0 104 Q60 92 120 102 T160 100 V120 H0Z" fill="#8A5A4B"/></g><rect width="160" height="120" fill="#fff" opacity=".04"/></svg><rect x="-210.0" y="-270.0" width="420" height="540" fill="url(#nuestrahisdspine)"/></g><g transform="translate(120 130) rotate(12)"><rect width="260" height="16" rx="3" fill="#D9B98C"/><rect width="260" height="5" fill="#E7CDA6"/><path d="M260 0 L296 8 L260 16Z" fill="#F1DEC4"/><path d="M286 5 L296 8 L286 11Z" fill="#4A3