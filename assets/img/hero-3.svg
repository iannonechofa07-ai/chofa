  <stop offset=".5" stop-color="#4A3228" stop-opacity=".22"/>
  <stop offset=".56" stop-color="#4A3228" stop-opacity=".05"/>
  <stop offset="1" stop-color="#000" stop-opacity="0"/>
</linearGradient>
