<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1100" width="1600" height="1100" role="img"><title>Álbum de fotos abierto sobre una mesa</title><defs>
<filter id="hero3grain" x="0" y="0" width="100%" height="100%">
